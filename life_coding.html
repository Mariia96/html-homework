<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Картка подкасту</title>
    <link rel="stylesheet" href="life_coding.css">
</head>
<body>
<main>
    <article class="card-podcast">
        <div class="card-podcast__left">
        <span class="card-podcast__badge">Епізод #12</span>
         <img class="card-podcast__image" src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc?q=80&w=400&auto=format&fit=crop" alt="Мікрофон">
         </div>
        <div class="card-podcast__right">
            <h1 class="card-podcast__title">Штучний інтелект у розробці</h1>
            <p class="card-podcast__subtitle">Frontend & Coffee Podcast</p>
            <div class="card-podcast__progressbar">
                <div class="card-podcast__progress-fill"></div>
            </div>
            <div class="card-podcast__time">
                <span class="card-podcast__current-time">12:34</span>
                <span class="card-podcast__total-time">45:20</span>
            </div>
            <div class="card-podcast__buttons">
                <button class="card-podcast__button">Back</button>
            
                <button class="card-podcast__button card-podcast__button--big">
                    Play
                </button>
            
                <button class="card-podcast__button">Forward</button>
            </div>
    </article>
</main>
    
</body>
</html>
